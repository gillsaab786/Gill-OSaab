# Gill-OSaab feature defaults (Version 1 plan).
# on = enabled by default, off = optional and off until you turn it on.

# Windows apps: each app gets its own Wine prefix with no access to your home folder
sandbox_windows_apps=on

# Screen-off mode: seconds with no running task before the screen wakes
screen_off_idle_seconds=15
# Overnight / Work option: show "Done" for 10 seconds, then suspend
screen_off_overnight=off

# Optional features, off by default
phone_link=off
shared_game_library=off
vpn=off
cloud_drives=off
night_light=off
auto_dark_mode_sunset=off
vrr=off
suspend_then_hibernate=off
undervolt=off
smart_updates=off
pause_downloads_while_gaming=off
