# Gill(OS) hardening: an app can't read another app's memory (ptrace) unless it started it,
# and kernel addresses stay hidden from apps.
kernel.yama.ptrace_scope = 1
kernel.kptr_restrict = 1


# Compressed swap in RAM (zram): prefer compressing idle memory over dropping file caches, no
# read-ahead from zram, and no memory "boosting" stalls (as on SteamOS/Pop!_OS/ChromeOS).
vm.swappiness = 180
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
# Keep kernel messages (crash traps, audit lines) off the screen; they stay in the journal.
kernel.printk = 3 4 1 3
