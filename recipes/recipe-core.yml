# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# Gill-OSaab Core: built directly on minimal Fedora bootc (no Bazzite, no extras).
# Only what Gill-OSaab uses is installed, so only that runs.
# Desktop: Gill-OSaab's own window manager (gosaab-wm) and shell; Game Mode: gamescope + Steam.
# Published to ghcr.io/<owner>/gill-osaab-core
name: gill-osaab-core
description: Gill-OSaab Core, a minimal gaming OS on Fedora bootc.

base-image: quay.io/fedora/fedora-bootc
image-version: "45"

modules:
  - type: dnf
    repos:
      files:
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo # Brave, the default browser
      keys:
        - https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
      nonfree: rpmfusion
      copr:
        - bieszczaders/kernel-cachyos-addons # gaming CPU schedulers (scx)
        - errornointernet/quickshell # newest Quickshell (the shell UI toolkit)
        - hhd-dev/hhd # Handheld Daemon: TDP, fans, controller buttons in Steam's quick menu
        - jackgreiner/lsfg-vk-git # frame generation layer (lsfg-vk)
    install:
      skip-unavailable: true
      packages:
        # --- hardware, network, sound
        - linux-firmware
        - alsa-sof-firmware
        - NetworkManager-wifi
        - NetworkManager-bluetooth
        - bluez
        - pipewire
        - pipewire-pulseaudio
        - pipewire-alsa
        - wireplumber
        - tuned-ppd
        - upower
        - fwupd
        - pciutils
        # --- graphics (newest Mesa from Fedora, video decoding from RPM Fusion)
        - mesa-dri-drivers
        - mesa-vulkan-drivers
        - mesa-va-drivers-freeworld
        - vulkan-loader
        # --- desktop: Gill-OSaab's own (gosaab-wm + shell, built below), nothing else
        - sddm
        - sddm-wayland-generic
        - quickshell
        - swaybg
        - swayidle
        - wlr-randr
        - plymouth-plugin-script
        - plymouth-plugin-label
        # --- drivers and helpers for whatever gets plugged in (no setup needed)
        - cups
        - cups-filters
        - gutenprint-cups
        - hplip
        - ipp-usb
        - sane-backends
        - sane-airscan
        - simple-scan
        - system-config-printer
        - fwupd
        - bolt
        - iio-sensor-proxy
        - usbutils
        - python3-evdev
        - pciutils
        - wdisplays
        - xwayland-satellite
        - xorg-x11-server-Xwayland
        - qt6-qtwayland
        - qt6-qtsvg
        - foot
        - nautilus
        - brave-browser
        - vlc
        - wireguard-tools
        - NetworkManager-openvpn
        - xdg-desktop-portal-wlr
        - xdg-desktop-portal-gtk
        - lxqt-policykit
        - gnome-keyring
        - grim
        - slurp
        - wl-clipboard
        - playerctl
        - adwaita-icon-theme
        - adwaita-cursor-theme
        - xdg-user-dirs
        - glibc-langpack-en
        - google-noto-sans-fonts
        - google-noto-color-emoji-fonts
        - rsms-inter-fonts
        - papirus-icon-theme
        # --- gaming
        - steam
        - steam-devices
        - gamescope
        - hhd
        - hhd-ui
        - adjustor
        - ryzenadj
        - lsfg-vk
        - mangohud
        - scx-scheds
        - scx-tools
        # --- Windows, Android and Linux apps
        - wine
        - wine-dxvk
        - bindfs
        - rclone
        - fuse3
        - android-tools
        - git-core
        - python3-pip
        - waydroid
        - distrobox
        - flatpak
        - bubblewrap
        # --- Gill-OSaab tools
        - python3-pyside6
        - python3-gobject
        - libnotify
        - brightnessctl
        - firewalld
        - xdg-dbus-proxy
        # CPU and GPU support for Intel and AMD (Nvidia: the core-nvidia edition)
        - microcode_ctl
        - amd-ucode-firmware
        - thermald
        - intel-media-driver
        - libva-intel-media-driver
        - intel-vpl-gpu-rt
        - mesa-vulkan-drivers.i686
        - mesa-dri-drivers.i686
        - vulkan-tools
        - gamemode
        - mokutil
        # on-screen keyboard for touch screens
        - wvkbd

  - from-file: common.yml

  # Core-only: session files, Game Mode switch (SteamOS-compatible)
  - type: files
    files:
      - source: core-system
        destination: /

  # Build and install the Gill-OSaab window manager + shell + login screen from this repo
  - type: containerfile
    snippets:
      - COPY shell /tmp/gosaab-shell
      - RUN bash /tmp/gosaab-shell/install.sh /tmp/gosaab-shell && rm -rf /tmp/gosaab-shell && dnf clean all

  - type: script
    scripts:
      - gosaab-core-setup.sh
