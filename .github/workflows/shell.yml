name: gill-osaab-shell
on:
  push:
    paths:
      - "shell/**"
      - ".github/workflows/shell.yml"
  workflow_dispatch:

jobs:
  compositor:
    name: Build and test gosaab-wm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Virtual GPU (vkms)
        run: sudo modprobe vgem; sudo modprobe vkms; ls -la /dev/dri
      - name: Build, unit tests, headless run with screenshots
        run: |
          docker run --rm --privileged -v /dev/dri:/dev/dri -v "$PWD":/src -w /src \
            registry.fedoraproject.org/fedora:45 bash -c '
              set -e
              dnf -y -q install gcc meson ninja-build pkgconf wayland-devel wayland-protocols-devel \
                wlroots-devel scenefx-devel libxkbcommon-devel pixman-devel \
                mesa-dri-drivers mesa-libEGL mesa-libgbm grim foot swaybg \
                dejavu-sans-mono-fonts python3-pillow procps-ng \
                pango-devel cairo-devel libdrm-devel rsms-inter-fonts >/dev/null
              meson setup shell/compositor/build shell/compositor
              meson compile -C shell/compositor/build
              meson test -C shell/compositor/build --print-errorlogs
              bash shell/tests/run-headless.sh shell/compositor/build artifacts'
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gosaab-wm-screenshots
          path: artifacts/
      - name: Publish screenshots to the ci-shots branch
        if: always()
        run: |
          sudo chown -R "$(id -u)" artifacts 2>/dev/null || exit 0
          cd artifacts
          git init -q && git checkout -q -b ci-shots
          git add -A && git -c user.name=gill-osaab-ci -c user.email=ci@gill-osaab.local commit -qm "screens for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-shots
