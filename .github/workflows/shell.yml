name: gill-osaab-shell
on:
  push:
    paths:
      - "shell/**"
      - ".github/workflows/shell.yml"
  workflow_dispatch:

jobs:
  compositor:
    name: Build and test gosaab-wm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Virtual GPU (vkms)
        run: sudo modprobe vgem; sudo modprobe vkms; ls -la /dev/dri
      - name: Build, unit tests, headless run with screenshots
        run: |
          docker run --rm --privileged -v /dev/dri:/dev/dri -v "$PWD":/src -w /src \
            registry.fedoraproject.org/fedora:45 bash -c '
              set -e
              dnf -y -q install gcc meson ninja-build pkgconf wayland-devel wayland-protocols-devel \
                wlroots-devel scenefx-devel libxkbcommon-devel pixman-devel \
                mesa-dri-drivers mesa-libEGL mesa-libgbm grim foot swaybg \
                dejavu-sans-mono-fonts python3-pillow procps-ng \
                pango-devel cairo-devel libdrm-devel libinput-devel rsms-inter-fonts >/dev/null
              dnf -y -q install wlr-randr python3-gobject glib2 dbus-daemon libnotify adwaita-icon-theme qt6-qtsvg qt6-qtwayland >/dev/null
              dnf -y -q install xwayland-satellite xorg-x11-server-Xwayland xkeyboard-config sddm >/dev/null || echo "no xwayland-satellite package"
              dnf -y -q install xclock >/dev/null 2>&1 || dnf -y -q install xorg-x11-apps >/dev/null 2>&1 || echo "no xclock"
              dnf -y -q install quickshell >/dev/null 2>&1 || { dnf -y -q install dnf-plugins-core >/dev/null; \
                dnf -y -q copr enable errornointernet/quickshell >/dev/null; dnf -y -q install quickshell >/dev/null; }
              qs --version || true
              meson setup shell/compositor/build shell/compositor --buildtype=debugoptimized
              meson compile -C shell/compositor/build
              meson test -C shell/compositor/build --print-errorlogs
              bash shell/tests/run-headless.sh shell/compositor/build artifacts || headless_failed=1
              # turn any crash backtrace into file:line
              grep -ho "gosaab-wm(+0x[0-9a-f]*)" artifacts/gosaab-wm*.log 2>/dev/null | sed "s/.*(+\\(0x[0-9a-f]*\\))/\\1/" | \
                xargs -r addr2line -f -C -p -e shell/compositor/build/gosaab-wm | head -40
              [ -z "${headless_failed:-}" ] || exit 1
              echo "== install into the system, as the Core image build does"
              bash shell/install.sh "$PWD/shell" >/tmp/install.log 2>&1 || { tail -30 /tmp/install.log; exit 1; }
              test -x /usr/bin/gosaab-wm && test -f /etc/xdg/quickshell/gill-osaab/shell.qml && test -f /usr/share/sddm/themes/gill-osaab/Main.qml
              for f in files/core-system/usr/bin/* files/core-system/usr/libexec/gill-osaab/*; do sh -n "$f" || exit 1; done
              echo "PASS: install.sh installs the desktop; session scripts parse"'
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gosaab-wm-screenshots
          path: artifacts/
      - name: Publish screenshots to the ci-shots branch
        if: always()
        run: |
          sudo chown -R "$(id -u)" artifacts 2>/dev/null || exit 0
          cd artifacts
          git init -q && git checkout -q -b ci-shots
          git add -A && git -c user.name=gill-osaab-ci -c user.email=ci@gill-osaab.local commit -qm "screens for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-shots
