name: build-core-usb
# Makes a bootable USB image of Gill(OS) Core (bootc-image-builder raw disk): write it to a
# USB stick (32 GB+) and boot from it to try everything without touching the internal drive.
# (The Anaconda ISO needs Fedora 45 installer definitions that bootc-image-builder lacks.)
# Published on the "core-usb" release, split in parts because GitHub limits files to 2 GB.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [core-image-smoke-test]
    types: [completed]

concurrency:
  group: core-usb
  cancel-in-progress: false

jobs:
  # Nightly rebuilds of the same commit must not replace the published parts: anyone mid-download
  # would end up with parts from two builds that don't join into a valid image.
  check:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.c.outputs.publish }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          old=$(gh api "repos/${{ github.repository }}/git/ref/tags/core-usb" -q .object.sha 2>/dev/null || true)
          if [ "${{ github.event_name }}" = workflow_run ] && [ "$old" = "$sha" ]; then
            echo "USB for $sha is already published; keeping it"; echo publish=no >> "$GITHUB_OUTPUT"
          else
            echo publish=yes >> "$GITHUB_OUTPUT"
          fi
  iso:
    needs: check
    if: ${{ needs.check.outputs.publish == 'yes' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4 # for tools/Get-GillOSaab-USB.ps1
      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af >/dev/null || true
          # AppArmor on the runner blocks osbuild's mounts ("mount: permission denied")
          sudo aa-teardown || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          df -h /
      - name: Pull the Core image
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman pull ghcr.io/${{ github.repository_owner }}/gill-osaab-core:latest
      - name: Build the USB image
        run: |
          mkdir -p output
          # test login: user "gill", password "gill" (change it with: passwd)
          cat > config.toml <<'TOML'
          [[customizations.user]]
          name = "gill"
          password = "gill"
          groups = ["wheel"]
          TOML
      - name: bootc-image-builder
        uses: osbuild/bootc-image-builder-action@main
        with:
          image: ghcr.io/${{ github.repository_owner }}/gill-osaab-core:latest
          config-file: ./config.toml
          types: raw
          rootfs: btrfs
      - name: Compress, split and checksum
        run: |
          img=$(sudo find output -name '*.raw' | head -1)
          [ -n "$img" ] || img=$(sudo find . -name '*.raw' -not -path './proc/*' | head -1)
          echo "image: $img"
          sudo xz -T0 -2 -k "$img"
          mkdir -p release
          sudo split -b 1900M -d -a 2 "$img.xz" release/gill-osaab-core-usb.img.xz.part-
          sudo sha256sum "$img.xz" | sed 's|  .*|  gill-osaab-core-usb.img.xz|' | sudo tee release/SHA256SUMS
          cp tools/Get-GillOSaab-USB.ps1 release/
          sudo chown -R "$(id -u)" release && ls -lh release
      - name: Publish on the core-usb release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete core-usb --yes --cleanup-tag -R "${{ github.repository }}" || true
          gh release create core-usb release/* -R "${{ github.repository }}" --prerelease \
            --target "${{ github.event.workflow_run.head_sha || github.sha }}" \
            --title "Gill(OS) Core bootable USB (test build)" \
            --notes "Bootable USB image of Gill(OS) Core (AMD/Intel; the installer picks the Nvidia edition by itself on RTX/GTX 16 PCs). Windows: download Get-GillOSaab-USB.ps1, right-click > Run with PowerShell: it downloads or joins the parts, checks the SHA-256 and opens balenaEtcher. Linux/macOS: cat gill-osaab-core-usb.img.xz.part-* > gill-osaab-core-usb.img.xz, check SHA256SUMS, flash with balenaEtcher. Use a 32 GB+ USB stick. Boot from it (ROG Ally/GPD: hold Volume Down + Power), sign in as gill / gill, then open Install Gill(OS) in Launchpad to install on the PC, encrypted."
