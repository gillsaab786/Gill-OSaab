name: build-core-usb
# Makes a bootable USB image of Gill-OSaab Core (bootc-image-builder raw disk): write it to a
# USB stick (32 GB+) and boot from it to try everything without touching the internal drive.
# (The Anaconda ISO needs Fedora 45 installer definitions that bootc-image-builder lacks.)
# Published on the "core-usb" release, split in parts because GitHub limits files to 2 GB.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [core-image-smoke-test]
    types: [completed]

concurrency:
  group: core-usb
  cancel-in-progress: false

jobs:
  iso:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af >/dev/null || true
          df -h /
      - name: Pull the Core image
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman pull ghcr.io/${{ github.repository_owner }}/gill-osaab-core:latest
      - name: Build the USB image
        run: |
          mkdir -p output
          # test login: user "gill", password "gill" (change it with: passwd)
          cat > config.toml <<'TOML'
          [[customizations.user]]
          name = "gill"
          password = "gill"
          groups = ["wheel"]
          TOML
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v ./output:/output -v ./config.toml:/config.toml:ro \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type raw --rootfs btrfs \
            ghcr.io/${{ github.repository_owner }}/gill-osaab-core:latest
          sudo find output -type f -exec ls -lh {} \;
      - name: Compress, split and checksum
        run: |
          img=$(sudo find output -name '*.raw' | head -1)
          sudo xz -T0 -6 -k "$img"
          mkdir -p release
          sudo split -b 1900M -d -a 2 "$img.xz" release/gill-osaab-core-usb.img.xz.part-
          sudo sha256sum "$img.xz" | sed 's|  .*|  gill-osaab-core-usb.img.xz|' | sudo tee release/SHA256SUMS
          sudo chown -R "$(id -u)" release && ls -lh release
      - name: Publish on the core-usb release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete core-usb --yes --cleanup-tag -R "${{ github.repository }}" || true
          gh release create core-usb release/* -R "${{ github.repository }}" --prerelease \
            --title "Gill-OSaab Core bootable USB (test build)" \
            --notes "Bootable USB image of Gill-OSaab Core. 1) Download every part and join them: Windows: copy /b gill-osaab-core-usb.img.xz.part-00+gill-osaab-core-usb.img.xz.part-01+... gill-osaab-core-usb.img.xz (Linux/macOS: cat gill-osaab-core-usb.img.xz.part-* > gill-osaab-core-usb.img.xz). 2) Check SHA256SUMS. 3) Write it to a 32 GB+ USB stick with balenaEtcher (it reads .xz directly). 4) Boot from the stick (GPD/ROG Ally: hold Volume Down + Power for the boot menu). Login: gill / gill, then run passwd. Pick Gill-OSaab or Game Mode at the login screen."
