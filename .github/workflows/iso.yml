name: build-core-iso
# Makes an installer ISO of Gill-OSaab Core (bootc-image-builder, Anaconda installer) and
# publishes it on the "core-iso" GitHub Release. GitHub limits files to 2 GB, so the ISO is
# split into parts: join them with   cat gill-osaab-core.iso.part-* > gill-osaab-core.iso
# (Windows: copy /b gill-osaab-core.iso.part-aa+gill-osaab-core.iso.part-ab+... gill-osaab-core.iso)
on:
  workflow_dispatch:
  workflow_run:
    workflows: [core-image-smoke-test]
    types: [completed]

concurrency:
  group: core-iso
  cancel-in-progress: true

jobs:
  iso:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af >/dev/null || true
          df -h /
      - name: Pull the Core image
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman pull ghcr.io/${{ github.repository_owner }}/gill-osaab-core:latest
      - name: Build the installer ISO
        run: |
          mkdir -p output
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v ./output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso --rootfs btrfs \
            ghcr.io/${{ github.repository_owner }}/gill-osaab-core:latest
          sudo find output -name '*.iso' -exec ls -lh {} \;
      - name: Split and checksum
        run: |
          iso=$(sudo find output -name '*.iso' | head -1)
          mkdir -p release
          sudo split -b 1900M -d -a 2 "$iso" release/gill-osaab-core.iso.part-
          sudo sha256sum "$iso" | sed 's|  .*|  gill-osaab-core.iso|' | sudo tee release/SHA256SUMS
          sudo chown -R "$(id -u)" release && ls -lh release
      - name: Publish on the core-iso release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete core-iso --yes --cleanup-tag -R "${{ github.repository }}" || true
          gh release create core-iso release/* -R "${{ github.repository }}" --prerelease \
            --title "Gill-OSaab Core installer (test build)" \
            --notes "Installer ISO for Gill-OSaab Core, built from ghcr.io/${{ github.repository_owner }}/gill-osaab-core:latest. Download every part, join them (Linux/macOS: cat gill-osaab-core.iso.part-* > gill-osaab-core.iso, Windows: copy /b gill-osaab-core.iso.part-00+gill-osaab-core.iso.part-01+... gill-osaab-core.iso), check SHA256SUMS, write it to a USB stick with Fedora Media Writer or Rufus (DD mode), boot from it."
